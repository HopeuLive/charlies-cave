<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charlie's Cave</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f5f5; min-height: 100vh; }
    .header { background: #1a1a2e; color: #fff; padding: 20px; text-align: center; position: sticky; top: 0; z-index: 10; }
    .header h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 12px; }
    .search-box { max-width: 500px; margin: 0 auto; position: relative; }
    .search-box input { width: 100%; padding: 10px 40px 10px 16px; border: none; border-radius: 25px; font-size: 0.95rem; outline: none; background: rgba(255,255,255,0.12); color: #fff; }
    .search-box input::placeholder { color: rgba(255,255,255,0.55); }
    .container { max-width: 800px; margin: 0 auto; padding: 20px; }
    .file-list { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); overflow: hidden; }
    .file-item { display: block; padding: 16px 20px; text-decoration: none; color: #333; border-bottom: 1px solid #f0f0f0; font-size: 1rem; }
    .file-item:hover { background: #f8f9fa; }
    .file-item::before { content: "📄"; margin-right: 10px; }
    .empty { text-align: center; padding: 40px; color: #999; }
    .loading { text-align: center; padding: 40px; color: #666; }
    .error { text-align: center; padding: 40px; color: #e74c3c; }
  </style>
</head>
<body>
  <div class="header">
    <h1>📚 Charlie's Cave</h1>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="搜索文档标题..." autocomplete="off">
    </div>
  </div>
  <div class="container">
    <div id="fileList" class="file-list">
      <div class="loading">加载中...</div>
    </div>
  </div>
  <script>
    const REPO = 'charlies-cave';
    const DOCS_PATH = 'docs';
    const USERNAME = 'HopeuLive';
    let allFiles = [];
    async function loadFiles() {
      const container = document.getElementById('fileList');
      try {
        const response = await fetch('https://api.github.com/repos/' + USERNAME + '/' + REPO + '/contents/' + DOCS_PATH);
        if (!response.ok) throw new Error('Failed');
        const files = await response.json();
        allFiles = files.filter(function(f) { return f.type === 'file' && f.name.toLowerCase().endsWith('.txt'); }).map(function(f) { return { name: f.name.replace(/\.txt$/i, ''), path: f.path }; });
        allFiles.sort(function(a, b) { return a.name.localeCompare(b.name, 'zh-CN', { sensitivity: 'base', numeric: true }); });
        renderFileList(allFiles);
      } catch (error) {
        container.innerHTML = '<div class="error">加载失败，请刷新重试</div>';
      }
    }
    function renderFileList(files) {
      const container = document.getElementById('fileList');
      if (files.length === 0) { container.innerHTML = '<div class="empty">暂无文档</div>'; return; }
      let html = '';
      files.forEach(function(file) {
        html += '<a class="file-item" href="/charlies-cave/reader.html?path=' + encodeURIComponent(file.path) + '">' + file.name + '</a>';
      });
      container.innerHTML = html;
    }
    document.getElementById('searchInput').addEventListener('input', function(e) {
      const q = e.target.value.trim().toLowerCase();
      if (!q) { renderFileList(allFiles); return; }
      const results = allFiles.filter(function(f) { return f.name.toLowerCase().indexOf(q) !== -1; });
      renderFileList(results);
    });
    loadFiles();
  </script>
</body>
</html>
