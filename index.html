<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charlie's Cave</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
    }
    .header {
      background: #1a1a2e;
      color: #fff;
      padding: 20px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 12px; }
    .search-box {
      max-width: 500px;
      margin: 0 auto;
      position: relative;
    }
    .search-box input {
      width: 100%;
      padding: 10px 40px 10px 16px;
      border: none;
      border-radius: 25px;
      font-size: 0.95rem;
      outline: none;
      background: rgba(255,255,255,0.12);
      color: #fff;
      transition: background 0.2s;
    }
    .search-box input::placeholder { color: rgba(255,255,255,0.55); }
    .search-box input:focus { background: rgba(255,255,255,0.2); }
    .search-box .search-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
      pointer-events: none;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }
    .file-list {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      overflow: hidden;
    }
    .file-item {
      display: block;
      padding: 16px 20px;
      text-decoration: none;
      color: #333;
      border-bottom: 1px solid #f0f0f0;
      transition: background 0.2s;
      font-size: 1rem;
      line-height: 1.4;
    }
    .file-item:last-child { border-bottom: none; }
    .file-item:hover { background: #f8f9fa; }
    .file-item::before {
      content: "📄";
      margin-right: 10px;
      font-size: 1.1rem;
    }
    .empty { text-align: center; padding: 40px 20px; color: #999; }
    .loading { text-align: center; padding: 40px 20px; color: #666; }
    .error { text-align: center; padding: 40px 20px; color: #e74c3c; }
    .result-count {
      text-align: center;
      padding: 12px 20px;
      color: #888;
      font-size: 0.85rem;
      border-bottom: 1px solid #f0f0f0;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>📚 Charlie's Cave</h1>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="搜索文档标题..." autocomplete="off">
      <span class="search-icon">🔍</span>
    </div>
  </div>
  <div class="container">
    <div id="fileList" class="file-list">
      <div class="loading">加载中...</div>
    </div>
  </div>

  <script>
    const REPO = 'charlies-cave';
    const DOCS_PATH = 'docs';
    const USERNAME = 'HopeuLive';

    let allFiles = [];
    let debounceTimer = null;

    async function loadFiles() {
      const container = document.getElementById('fileList');
      try {
        const response = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/contents/${DOCS_PATH}`);
        if (!response.ok) throw new Error('Failed to load');
        const files = await response.json();
        allFiles = files
          .filter(f => f.type === 'file' && f.name.toLowerCase().endsWith('.txt'))
          .map(f => ({
            name: f.name.replace(/\.txt$/i, ''),
            path: f.path,
          }));
        allFiles.sort((a, b) => a.name.localeCompare(b.name, 'zh-CN', { sensitivity: 'base', numeric: true }));
        renderFileList(allFiles);
      } catch (error) {
        container.innerHTML = '<div class="error">加载失败，请刷新重试</div>';
      }
    }

    function renderFileList(files) {
      const container = document.getElementById('fileList');
      if (files.length === 0) {
        container.innerHTML = '<div class="empty">没有找到匹配的文档</div>';
        return;
      }
      let html = '';
      if (files.length !== allFiles.length && allFiles.length > 0) {
        html += `<div class="result-count">找到 ${files.length} 篇匹配文档</div>`;
      }
      html += files.map(file => 
        `<a class="file-item" href="/${REPO}/reader.html?path=${encodeURIComponent(file.path)}">${escapeHtml(file.name)}</a>`
      ).join('');
      container.innerHTML = html;
    }

    function searchFiles(query) {
      if (!query || query.trim() === '') {
        renderFileList(allFiles);
        return;
      }
      const q = query.trim().toLowerCase();
      const results = allFiles.filter(f => f.name.toLowerCase().includes(q));
      renderFileList(results);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    document.getElementById('searchInput').addEventListener('input', function(e) {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => searchFile
